services:
  - type: web
    # Keep the v2.1 service separate from the legacy finsight-ai deployment.
    name: finsight-ai-v21
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: openrouter/free
      - key: AUTO_AI
        value: "true"
      - key: ENABLE_OCR
        value: "true"
      - key: OCR_LANGUAGE
        value: rus+eng
      - key: OCR_FORM_DPI_SCALE
        value: "3.2"
      - key: OCR_TEXT_DPI_SCALE
        value: "2.8"
      - key: OCR_PRIMARY_FORM_PAGES
        value: "14"
      - key: OCR_MAX_PAGES
        value: "0"
      - key: OCR_RETRY_DPI_SCALE
        value: "3.8"
      - key: ENABLE_VISION_RECOVERY
        value: "true"
      - key: VISION_MAX_PAGES
        value: "12"
      - key: VISION_LOCATOR_MAX_PAGES
        value: "180"
      - key: VISION_CONTACT_SHEET_PAGES
        value: "12"
      - key: PORT
        value: "8000"
